<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Obsidian Facet Gradients -->
    <linearGradient id="obsidianTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A7BFF"/>
      <stop offset="100%" stop-color="#6C3CE9"/>
    </linearGradient>
    
    <linearGradient id="obsidianLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <linearGradient id="obsidianRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="obsidianBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#1E0A2A"/>
    </linearGradient>

    <!-- VS Code Ribbon Gradients -->
    <linearGradient id="vscodeLightBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#007ACC"/>
    </linearGradient>

    <linearGradient id="vscodeMediumBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>

    <linearGradient id="vscodeDarkBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005A9E"/>
      <stop offset="100%" stop-color="#003B66"/>
    </linearGradient>

    <!-- Drop Shadow & Glow Filters -->
    <filter id="crystalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E0A38" flood-opacity="0.6"/>
    </filter>

    <filter id="ribbonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001833" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Obsidian Faceted Crystal Base -->
    <g filter="url(#crystalShadow)">
      <!-- Top Crest -->
      <polygon points="256,40 370,120 256,175 142,120" fill="url(#obsidianTop)" />

      <!-- Left Upper Facet -->
      <polygon points="142,120 256,175 220,330 90,260" fill="url(#obsidianLeft)" />

      <!-- Right Upper Facet -->
      <polygon points="370,120 422,260 292,330 256,175" fill="url(#obsidianRight)" />

      <!-- Center-Left Core Facet -->
      <polygon points="256,175 292,330 256,472 220,330" fill="#4C1D95" />

      <!-- Bottom Left Base Facet -->
      <polygon points="90,260 220,330 256,472 150,440" fill="url(#obsidianBottom)" />

      <!-- Bottom Right Base Facet -->
      <polygon points="422,260 362,440 256,472 292,330" fill="#2E1065" />
    </g>

    <!-- Crystal Inner Highlight Lines -->
    <path d="M 256,175 L 256,472" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 142,120 L 256,175 L 370,120" fill="none" stroke="#E9D5FF" stroke-width="1.5" stroke-opacity="0.5"/>

    <!-- VS Code Infinity Ribbon Fusion -->
    <g filter="url(#ribbonGlow)">
      <!-- Back Cross Ribbons -->
      <!-- Lower Wing: Fold behind to foreground -->
      <path d="M 378,375 L 175,215 L 135,248 L 335,405 A 25,25 0 0,0 378,375 Z" 
            fill="url(#vscodeDarkBlue)" />
      
      <!-- Upper Wing: Fold behind to foreground -->
      <path d="M 135,264 L 175,297 L 378,137 A 25,25 0 0,0 335,107 L 135,264 Z" 
            fill="url(#vscodeMediumBlue)" />

      <!-- Left Loop Beak (Code Bracket Apex) -->
      <path d="M 135,248 L 180,280 L 135,264 A 18,18 0 0,1 115,256 A 18,18 0 0,1 135,248 Z" 
            fill="#005A9E" />

      <!-- Front Right Vertical/Loop Anchor -->
      <path d="M 345,102 
               L 410,154 
               A 24,24 0 0,1 420,172 
               L 420,340 
               A 24,24 0 0,1 410,358 
               L 345,410 
               A 16,16 0 0,1 320,398 
               L 320,114 
               A 16,16 0 0,1 345,102 Z" 
            fill="url(#vscodeLightBlue)" />
    </g>
  </g>
</svg>
